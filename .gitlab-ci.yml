# GitLab CI for the Agentric OS plugin for Claude Code. Same shape as the other Aglium repositories:
#   check   → on every push and merge request: the server compiles and its checks pass on the oldest and a current
#             Python, the plugin and its server say the same version, and Claude Code accepts the plugin
#   release → for a tag: the same checks, then a GitLab release named as the tag. A tag that is not the version in
#             .claude-plugin/plugin.json fails the pipeline before anything is released.
# Nothing is built or pushed anywhere: the plugin is installed straight from this repository.
# No CI/CD variables are needed.

default:
  timeout: 15m

stages:
  - check
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    # a branch with an open merge request is checked once, in the merge request
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

check_server:
  stage: check
  image: python:${PYTHON}-alpine
  parallel:
    matrix:
      - PYTHON: ["3.9", "3.13"]
  script:
    - python3 -m py_compile server/agentric_os_mcp.py server/test_agentric_os_mcp.py ci/release.py
    - python3 -m unittest discover -s server -v
    # the version is said in two places, and for a tag in three: they have to agree
    - python3 ci/release.py check

check_plugin:
  stage: check
  image: node:22-slim
  script:
    # the same check a person runs before proposing a change; it needs no sign-in
    - npx --yes @anthropic-ai/claude-code plugin validate .

release_job:
  stage: release
  needs:
    - job: check_server
    - job: check_plugin
  image: python:3.13-alpine
  script:
    - python3 ci/release.py publish
  rules:
    - if: '$CI_COMMIT_TAG'
