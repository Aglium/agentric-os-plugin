# For a tag: the same checks, then a GitHub release named as the tag, with that version's part of the changelog.
# A tag that is not the version in .claude-plugin/plugin.json fails before anything is released.
# Nothing is built: the plugin is installed straight from this repository.
name: release
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python3 -m unittest discover -s server -v
      - run: npx --yes @anthropic-ai/claude-code plugin validate .
      - run: python3 ci/release.py check
      - run: python3 ci/release.py notes > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
